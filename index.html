<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="三麻">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>三麻アーケード</title>
<style>
/* 三麻アーケード — styles (UI agent) */
/* Fixed 1280x720 stage scaled to the window with a CSS transform. */

:root {
  --gold: #d4af37;
  --gold-hi: #f7dc7a;
  --gold-lo: #8a6d1c;
  --felt: #0b3d2e;
  --felt-hi: #146b4c;
  --ink: #050806;
  --panel: rgba(6, 10, 8, .88);
  --orange: #ff8a1f;
  --red: #e0332f;
  --plus: #6cf08a;
  --minus: #ff6b6b;
  --text: #f4ecd6;
  --muted: #b8ad90;
  /* tile sizes (stage px) */
  --hw: 64px; --hh: 87px;     /* human hand */
  --rw: 34px; --rh: 46px;     /* river */
  --mw: 46px; --mh: 62px;     /* human melds */
  --kw: 30px; --kh: 41px;     /* kita (human) */
  --font: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  --num: "DIN Alternate", "Bahnschrift", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
}

html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font); color: var(--text); -webkit-tap-highlight-color: transparent; }

.sanma-root { position: fixed; inset: 0; overflow: clip; background:
  radial-gradient(ellipse at 50% 40%, #16110a 0%, #000 70%); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
  --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px); }
/* hidden probe: fit() reads its padding to keep the table clear of the notch and home indicator */
.safe-probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l); }
.sanma-root button { font-family: inherit; }

.rotate-hint { position: absolute; left: 0; right: 0; top: 12px; text-align: center; color: var(--gold);
  font-size: 14px; letter-spacing: .1em; opacity: .85; display: none; }
.rotate-hint.show { display: block; }

.stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: clip;
  background: #000; box-shadow: 0 0 0 2px #000, 0 0 40px rgba(212, 175, 55, .15); }

/* ---------- felt table ---------- */
.felt { position: absolute; left: 0; top: 40px; width: 1280px; height: 680px;
  background:
    radial-gradient(ellipse 70% 75% at 50% 48%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, rgba(0,0,0,.02) 2px 4px),
    radial-gradient(ellipse at 50% 45%, var(--felt-hi) 0%, var(--felt) 55%, #05241a 100%);
  box-shadow: inset 0 0 0 3px #000, inset 0 0 0 5px var(--gold-lo), inset 0 0 0 6px var(--gold), inset 0 0 80px rgba(0,0,0,.6); }
.felt::after { content: "三麻"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -64%); font-size: 260px;
  font-weight: 900; color: rgba(255,255,255,.018); letter-spacing: .1em; pointer-events: none; font-family: "Noto Serif CJK JP", serif; }

/* ---------- top bar ---------- */
.topbar { position: absolute; left: 0; top: 0; width: 1280px; height: 40px; display: flex; align-items: center; gap: 18px;
  padding: 0 14px; box-sizing: border-box; background: linear-gradient(#1a1a1a, #030303); border-bottom: 2px solid var(--gold); z-index: 5; }
.logo { font-weight: 900; font-size: 22px; letter-spacing: .12em; background: linear-gradient(180deg, #fff6c8 0%, var(--gold-hi) 30%, var(--gold) 60%, #8d6a14 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 6px rgba(212,175,55,.45)); white-space: nowrap; }
.topbar .tb-mode { font-size: 13px; color: var(--muted); letter-spacing: .15em; border: 1px solid #5b4a17; padding: 2px 10px; border-radius: 3px; }
.topbar .tb-info { font-size: 13px; color: var(--gold-hi); letter-spacing: .08em; }
.topbar .spacer { flex: 1; }
.tb-btn { height: 28px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--gold); background: linear-gradient(#3a3320, #15110a);
  color: var(--gold-hi); font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: .1em; }
.tb-btn:hover, .tb-btn:focus-visible { background: linear-gradient(#5b4c22, #221a0b); outline: none; box-shadow: 0 0 8px rgba(212,175,55,.6); }

/* ---------- generic tile ---------- */
.tl { position: relative; display: inline-block; flex: none; width: var(--w); height: var(--h); padding: 0; margin: 0; border: 0;
  background: none; line-height: 0; vertical-align: bottom; }
.tl > .face { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); filter: drop-shadow(1px 2px 1.5px rgba(0,0,0,.55)); }
.tl.rot { width: var(--h); height: var(--w); }
.tl.rot > .face { left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
.tl.rot-r > .face { transform: translate(-50%, -50%) rotate(90deg); }
.tsvg { display: block; width: 100%; height: 100%; }
.svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- center panel ---------- */
.center { position: absolute; left: 470px; top: 146px; width: 340px; height: 228px; box-sizing: border-box; border-radius: 16px;
  background: linear-gradient(160deg, rgba(20,20,16,.95), rgba(3,5,4,.95)); border: 2px solid var(--gold);
  box-shadow: 0 0 0 4px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.6), inset 0 0 24px rgba(212,175,55,.12); }
.cp-round { position: absolute; left: 96px; right: 96px; top: 8px; text-align: center; font-size: 32px; font-weight: 900; color: var(--gold-hi);
  text-shadow: 0 0 10px rgba(247,220,122,.5); letter-spacing: .05em; white-space: nowrap; }
.cp-sub { position: absolute; left: 96px; right: 96px; top: 52px; display: flex; justify-content: center; gap: 10px; font-size: 13px; color: var(--text); white-space: nowrap; }
.cp-sub .stick-mini { display: inline-block; width: 18px; height: 5px; background: #fff; border-radius: 3px; position: relative; top: -2px; margin-right: 3px; }
.cp-sub .stick-mini::after { content: ""; position: absolute; left: 7px; top: 1px; width: 4px; height: 3px; border-radius: 50%; background: var(--red); }
.cp-dora { position: absolute; left: 96px; right: 96px; top: 76px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.cp-dora .lbl { font-size: 11px; color: var(--muted); letter-spacing: .3em; }
.cp-dora .tiles { display: flex; gap: 2px; --w: 26px; --h: 35px; }
.cp-dora.flash .tiles { animation: doraFlash .9s ease-out; }
@keyframes doraFlash { 0% { filter: drop-shadow(0 0 0 #fff); } 30% { filter: drop-shadow(0 0 10px #fff6a0); } 100% { filter: none; } }
.cp-wall { position: absolute; left: 96px; right: 96px; top: 134px; text-align: center; font-size: 13px; color: var(--muted); }
.cp-wall b { font-family: var(--num); font-size: 24px; color: #7ef7ff; text-shadow: 0 0 8px rgba(126,247,255,.6); margin-left: 6px; letter-spacing: .05em; }

.sb { position: absolute; box-sizing: border-box; border: 1px solid #5a4a1a; border-radius: 10px; background: linear-gradient(#141414, #050505);
  display: flex; align-items: center; justify-content: center; gap: 4px; transition: box-shadow .25s, border-color .25s; }
.sb0 { left: 90px; bottom: 8px; width: 160px; height: 46px; }
.sb1 { right: 8px; top: 30px; width: 82px; height: 118px; flex-direction: column; }
.sb2 { left: 8px; top: 30px; width: 82px; height: 118px; flex-direction: column; }
.sb.active { border-color: var(--orange); box-shadow: 0 0 14px 3px rgba(255,138,31,.75), inset 0 0 12px rgba(255,138,31,.35); animation: turnPulse 1.4s ease-in-out infinite; }
@keyframes turnPulse { 50% { box-shadow: 0 0 22px 6px rgba(255,138,31,.9), inset 0 0 16px rgba(255,138,31,.5); } }
.sb-wind { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 17px; background: #222; color: #ddd; border: 1px solid #555; flex: none; }
.sb-wind.dealer { background: radial-gradient(#ff5a4a, #9b1010); color: #fff; border-color: #ffb0a0; }
.sb-score { font-family: var(--num); font-size: 22px; font-weight: 700; color: #fff; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.sb-name { font-size: 11px; color: var(--muted); max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb0 .sb-name { display: none; }
.sb-stick { width: 56px; height: 7px; border-radius: 4px; background: #fff; position: relative; box-shadow: 0 0 6px rgba(255,255,255,.7); animation: stickIn .5s ease-out; }
.sb-stick::after { content: ""; position: absolute; left: 50%; top: 1.5px; width: 5px; height: 4px; margin-left: -2.5px; border-radius: 50%; background: var(--red); }
.sb0 .sb-stick { position: absolute; top: -12px; left: 50%; margin-left: -28px; }
@keyframes stickIn { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
.sb-delta { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--num); font-weight: 900; font-size: 22px;
  padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.85); pointer-events: none; animation: deltaIn 2.6s ease-out forwards; white-space: nowrap; }
.sb-delta.plus { color: var(--plus); } .sb-delta.minus { color: var(--minus); }
@keyframes deltaIn { 0% { opacity: 0; transform: translate(-50%, 0); } 12% { opacity: 1; transform: translate(-50%, -50%); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -90%); } }

/* ---------- side players ---------- */
.plate { position: absolute; top: 50px; width: 236px; height: 40px; box-sizing: border-box; border-radius: 6px; padding: 0 10px;
  background: linear-gradient(#171717, #030303); border: 1px solid var(--gold-lo); display: flex; align-items: center; gap: 8px; transition: box-shadow .25s, border-color .25s; }
.plate1 { right: 16px; flex-direction: row-reverse; }
.plate2 { left: 16px; }
.plate .pl-name { font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }
.plate .pl-wind { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 14px; background: #222; color: #ddd; border: 1px solid #555; flex: none; }
.plate .pl-wind.dealer { background: radial-gradient(#ff5a4a, #9b1010); color: #fff; border-color: #ffb0a0; }
.plate .pl-score { font-family: var(--num); font-size: 15px; font-weight: 700; color: var(--gold-hi); margin-left: auto; font-variant-numeric: tabular-nums; }
.plate1 .pl-score { margin-left: 0; margin-right: auto; }
.plate .pl-tag { font-size: 11px; font-weight: 900; color: #fff; background: linear-gradient(#ff7a3a, #b8300c); padding: 1px 6px; border-radius: 3px; letter-spacing: .1em; }
.plate .pl-think { display: none; gap: 3px; }
.plate.thinking .pl-think { display: inline-flex; }
.pl-think i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold-hi); animation: think 1s infinite; }
.pl-think i:nth-child(2) { animation-delay: .15s; } .pl-think i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
.plate.active { border-color: var(--orange); box-shadow: 0 0 14px 3px rgba(255,138,31,.7); }

.kita-row { position: absolute; top: 96px; display: flex; gap: 3px; --w: 22px; --h: 30px; }
.kita-row.k1 { right: 16px; }
.kita-row.k2 { left: 16px; }

.side-hand { position: absolute; top: 134px; width: 36px; display: flex; flex-direction: column; gap: 1px; }
.side-hand.h1 { left: 1226px; }
.side-hand.h2 { left: 18px; }
.st { width: 36px; height: 24px; box-sizing: border-box; border-radius: 4px; flex: none; box-shadow: 1px 2px 2px rgba(0,0,0,.55); }
.h1 .st { background: linear-gradient(90deg, #1d8a5b 0%, #136343 76%, #efe7cf 76%, #fffdf3 100%); }
.h2 .st { background: linear-gradient(270deg, #1d8a5b 0%, #136343 76%, #efe7cf 76%, #fffdf3 100%); }
.st.drawn { margin-top: 10px; }
.st.open { background: none; box-shadow: none; }

.side-melds { position: absolute; top: 134px; display: flex; flex-direction: column; gap: 8px; --w: 34px; --h: 46px; }
.side-melds.m1 { left: 1172px; }
.side-melds.m2 { left: 64px; }
.side-melds .meld { display: flex; flex-direction: column; gap: 1px; }

/* ---------- rivers ---------- */
.river-wrap { position: absolute; }
.river-wrap.r0 { left: 530px; top: 384px; width: 220px; height: 184px; }
.river-wrap.r1 { left: 818px; top: 150px; width: 184px; height: 220px; }
.river-wrap.r2 { left: 278px; top: 150px; width: 184px; height: 220px; }
.river { position: absolute; width: 220px; height: 184px; display: flex; flex-direction: column; gap: 0; --w: var(--rw); --h: var(--rh); }
.r1 .river, .r2 .river { left: 50%; top: 50%; }
.r1 .river { transform: translate(-50%, -50%) rotate(-90deg); }
.r2 .river { transform: translate(-50%, -50%) rotate(90deg); }
.river .row { display: flex; align-items: flex-end; height: var(--rh); }
.river .tl.taken { opacity: .38; filter: grayscale(.8); }
.river .tl.last::after { content: ""; position: absolute; left: 50%; top: -9px; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--orange);
  filter: drop-shadow(0 0 3px var(--orange)); animation: bob 1s ease-in-out infinite; }
.river .tl.rot.last::after { top: -7px; }
@keyframes bob { 50% { transform: translateY(-3px); } }

/* ---------- human hand ---------- */
.hand-row { position: absolute; left: 26px; top: 604px; height: 87px; display: flex; align-items: flex-end; gap: 0; }
.hand-row .hand, .hand-row .drawn { display: flex; align-items: flex-end; gap: 2px; --w: var(--hw); --h: var(--hh); }
.hand-row .drawn { margin-left: 16px; }
.hand-row .melds { display: flex; align-items: flex-end; gap: 8px; margin-left: 22px; --w: var(--mw); --h: var(--mh); }
.hand-row .melds .meld { display: flex; align-items: flex-end; gap: 1px; }
.hand-row .kita { display: flex; align-items: flex-end; gap: 2px; margin-left: 14px; --w: var(--kw); --h: var(--kh); }
.ht { cursor: default; transition: transform .12s ease-out, filter .12s; border-radius: 6px; }
.ht:not([disabled]) { cursor: pointer; }
.ht:not([disabled]):hover { transform: translateY(-8px); }
.ht.sel { transform: translateY(-16px) !important; }
.ht.sel > .face { filter: drop-shadow(0 0 6px var(--orange)) drop-shadow(0 0 2px #fff) drop-shadow(1px 2px 2px rgba(0,0,0,.6)); }
.ht.dim > .face { filter: brightness(.5) grayscale(.35); }
.ht:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.hand-row.myturn::before { content: ""; position: absolute; left: -6px; right: -6px; bottom: -6px; height: 4px; border-radius: 3px;
  background: linear-gradient(90deg, transparent, var(--orange), transparent); box-shadow: 0 0 12px var(--orange); }

.hint { position: absolute; left: 30px; top: 696px; height: 18px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gold-hi);
  --w: 13px; --h: 18px; white-space: nowrap; }
.hint .fur { color: #fff; background: #b8300c; font-size: 11px; padding: 0 5px; border-radius: 3px; font-weight: 700; }
.hint .tl > .face { filter: none; }

/* ---------- action bar ---------- */
.action-bar { position: absolute; right: 100px; top: 504px; width: 460px; height: 82px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.action-bar[hidden] { display: none; }
.timer { position: relative; width: 100%; height: 12px; display: flex; align-items: center; gap: 8px; }
.timer[hidden] { display: none; }
.timer .t-num { font-family: var(--num); font-weight: 900; font-size: 18px; color: var(--gold-hi); width: 28px; text-align: right; text-shadow: 0 0 6px rgba(247,220,122,.6); }
.timer .t-track { flex: 1; height: 8px; border-radius: 4px; background: #141414; border: 1px solid var(--gold-lo); overflow: hidden; }
.timer .t-fill { height: 100%; width: 100%; transform-origin: 0 50%; background: linear-gradient(90deg, #ffe27a, var(--orange)); box-shadow: 0 0 8px var(--orange); }
.timer.low .t-fill { background: linear-gradient(90deg, #ff5a3a, #d1120c); }
.timer.low .t-num { color: #ff6a4a; }
.btns { display: flex; gap: 10px; justify-content: flex-end; }
.act { position: relative; min-width: 100px; height: 58px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--gold-hi); cursor: pointer;
  font-size: 26px; font-weight: 900; color: #fff; letter-spacing: .06em; text-shadow: 0 2px 0 rgba(0,0,0,.5), 0 0 8px rgba(0,0,0,.4);
  box-shadow: 0 4px 0 rgba(0,0,0,.6), 0 0 16px rgba(255,200,80,.35), inset 0 2px 0 rgba(255,255,255,.4); transition: transform .08s, filter .12s; }
.act:hover, .act:focus-visible { filter: brightness(1.15); outline: none; }
.act:focus-visible { box-shadow: 0 4px 0 rgba(0,0,0,.6), 0 0 0 3px #fff, 0 0 18px rgba(255,200,80,.7); }
.act:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.6); }
.act.win { background: linear-gradient(#ff7b52, #d11b12 60%, #8e0c07); border-color: #ffd9a0; animation: winPulse 1s ease-in-out infinite; min-width: 120px; font-size: 30px; }
@keyframes winPulse { 50% { box-shadow: 0 4px 0 rgba(0,0,0,.6), 0 0 30px 8px rgba(255,90,40,.85), inset 0 2px 0 rgba(255,255,255,.4); } }
.act.riichi { background: linear-gradient(#ffd66b, #e28a0e 60%, #9d5500); }
.act.call { background: linear-gradient(#5fc2ff, #1a5fc8 60%, #0b347a); }
.act.kita { background: linear-gradient(#83e0a8, #1b8a4d 60%, #0b4f2a); }
.act.pass { background: linear-gradient(#777, #333 60%, #1a1a1a); border-color: #bbb; font-size: 22px; }
.act.on { outline: 3px solid #fff; outline-offset: 2px; }
.act small { font-size: 12px; display: block; letter-spacing: 0; opacity: .85; margin-top: -4px; }
.act-note.call-note { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; --w: 30px; --h: 41px; margin-right: 2px; }
.act-note { font-size: 14px; color: var(--gold-hi); align-self: center; margin-right: 6px; text-shadow: 0 0 6px #000; }
.chooser { position: absolute; right: 0; bottom: 100%; margin-bottom: 8px; display: flex; gap: 8px; padding: 8px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--gold); box-shadow: 0 6px 20px rgba(0,0,0,.6); --w: 34px; --h: 46px; }
.chooser[hidden] { display: none; }
.chooser button { display: flex; gap: 2px; padding: 5px; border-radius: 6px; border: 1px solid #6a5a26; background: #1b1b1b; cursor: pointer; }
.chooser button:hover, .chooser button:focus-visible { border-color: var(--orange); box-shadow: 0 0 10px var(--orange); outline: none; }

/* ---------- effects ---------- */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.call-flash { position: absolute; transform: translate(-50%, -50%); font-size: 72px; font-weight: 900; font-style: italic; white-space: nowrap; letter-spacing: .04em;
  color: #fff4c4; -webkit-text-stroke: 3px #5a2b00; paint-order: stroke fill;
  text-shadow: 0 0 18px rgba(255,160,40,.95), 0 0 42px rgba(255,90,20,.75); animation: flash .9s cubic-bezier(.2,1.4,.4,1) forwards; }
.call-flash.big { font-size: 120px; color: #fff; text-shadow: 0 0 24px #ff3b1a, 0 0 60px #ffae00; }
.call-flash.draw { color: #d8f2ff; text-shadow: 0 0 20px #3aa0ff; -webkit-text-stroke: 3px #062a52; }
@keyframes flash { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(.95); }
  35% { transform: translate(-50%, -50%) scale(1.05); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }
.call-flash.hold { animation: flashHold .9s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes flashHold { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(.95); } 45%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.burst { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,210,90,.18) 0 6deg, transparent 6deg 18deg); animation: burst 1.2s ease-out forwards; }
@keyframes burst { from { transform: scale(.2) rotate(0); opacity: 1; } to { transform: scale(1.4) rotate(40deg); opacity: 0; } }

.anim-draw { animation: drawIn .24s ease-out; }
@keyframes drawIn { from { transform: translateY(-26px); opacity: 0; } to { transform: none; opacity: 1; } }
.h1 .anim-draw, .h2 .anim-draw { animation: sideIn .22s ease-out; }
@keyframes sideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.anim-disc { animation: discIn .26s cubic-bezier(.2,1.3,.4,1); }

<div id="app"></div>
<script>
/* ===== src/engine.js ===== */
/* SANMA ARCADE - engine.js
 * Pure mahjong rules engine for 3-player mahjong (三人麻雀).
 * Tile helpers, wall, shanten, waits, ukeire, discard analysis, win evaluation and scoring.
 * No state, no DOM. Works in the browser (window.Sanma.Engine) and in Node (module.exports).
 */
(function () {
  'use strict';

  var root = (typeof window !== 'undefined') ? window : (typeof global !== 'undefined' ? global : this);
  var Sanma = root.Sanma = root.Sanma || {};

  // ---------------------------------------------------------------------------------------------
  // Tile basics
  // ---------------------------------------------------------------------------------------------
  var EAST = 27, SOUTH = 28, WEST = 29, NORTH = 30, HAKU = 31, HATSU = 32, CHUN = 33;
  var RED_IDS = [13 * 4, 22 * 4]; // 5p copy 0 (52), 5s copy 0 (88)

  var SANMA_KINDS = [];
  (function () {
    for (var k = 0; k < 34; k++) {
      if (k >= 1 && k <= 7) continue; // 2m..8m do not exist in sanma
      SANMA_KINDS.push(k);
    }
  })();
  var SANMA_SET = new Array(34);
  for (var _i = 0; _i < 34; _i++) SANMA_SET[_i] = false;
  SANMA_KINDS.forEach(function (k) { SANMA_SET[k] = true; });

  function kindOf(id) { return (id / 4) | 0; }
  function isRed(id) { return id === RED_IDS[0] || id === RED_IDS[1]; }
  function makeTile(id) { return { id: id, kind: kindOf(id), red: isRed(id) }; }
  function isSanmaKind(kind) { return kind >= 0 && kind < 34 && SANMA_SET[kind]; }
  function suitOf(kind) { return kind < 9 ? 'm' : kind < 18 ? 'p' : kind < 27 ? 's' : 'z'; }
  function numOf(kind) { return kind < 27 ? (kind % 9) + 1 : kind - 26; }
  function isHonor(kind) { return kind >= 27; }
  function isTerminal(kind) { return kind < 27 && (kind % 9 === 0 || kind % 9 === 8); }
  function isYaochu(kind) { return kind >= 27 || kind % 9 === 0 || kind % 9 === 8; }
  function isDragon(kind) { return kind >= 31 && kind <= 33; }
  function isWind(kind) { return kind >= 27 && kind <= 30; }

  var HONOR_EN = ['E', 'S', 'W', 'N', 'Wh', 'G', 'R'];
  var HONOR_JA = ['東', '南', '西', '北', '白', '發', '中'];
  var NUM_JA = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
  var SUIT_JA = { m: '萬', p: '筒', s: '索' };

  function tileName(kind) {
    if (kind >= 27) return HONOR_EN[kind - 27];
    return numOf(kind) + suitOf(kind);
  }
  function tileNameJa(kind) {
    if (kind >= 27) return HONOR_JA[kind - 27];
    return NUM_JA[kind % 9] + SUIT_JA[suitOf(kind)];
  }

  function doraOf(ind) {
    if (ind === 0) return 8;          // 1m -> 9m (sanma)
    if (ind === 8) return 0;          // 9m -> 1m (sanma)
    if (ind < 27) return (ind % 9 === 8) ? ind - 8 : ind + 1;
    if (ind <= 30) return ind === 30 ? 27 : ind + 1;   // E->S->W->N->E
    return ind === 33 ? 31 : ind + 1;                 // Wh->G->R->Wh
  }

  function newWall(rng) {
    rng = rng || Math.random;
    var wall = [];
    SANMA_KINDS.forEach(function (k) {
      for (var c = 0; c < 4; c++) wall.push(makeTile(k * 4 + c));
    });
    for (var i = wall.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      if (j > i) j = i;
      var t = wall[i]; wall[i] = wall[j]; wall[j] = t;
    }
    return wall;
  }

  function toCounts(kinds) {
    var c = new Array(34);
    for (var i = 0; i < 34; i++) c[i] = 0;
    for (var j = 0; j < kinds.length; j++) {
      var k = kinds[j];
      if (typeof k === 'object' && k !== null) k = tKind(k);
      c[k]++;
    }
    return c;
  }

  // Accept Tile objects, or raw ids.
  function tKind(t) {
    if (typeof t === 'number') return kindOf(t);
    if (t && typeof t.kind === 'number') return t.kind;
    return kindOf(t.id);
  }
  function tRed(t) {
    if (typeof t === 'number') return isRed(t);
    if (!t) return false;
    if (t.red) return true;
    return typeof t.id === 'number' && isRed(t.id);
  }

  // ---------------------------------------------------------------------------------------------
  // Hand notation: "19m123p0p456s11z" (z: 1..7 = 東南西北白發中, 0 = red five)
  // ---------------------------------------------------------------------------------------------
  function parseRaw(str) {
    var out = []; // [{kind, red}]
    var digits = [];
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      if (ch >= '0' && ch <= '9') { digits.push(+ch); continue; }
      if (ch === ' ') continue;
      var base = ch === 'm' ? 0 : ch === 'p' ? 9 : ch === 's' ? 18 : ch === 'z' ? 27 : -1;
      if (base < 0) throw new Error('parseHand: bad suit char ' + ch);
      for (var j = 0; j < digits.length; j++) {
        var d = digits[j];
        if (ch === 'z') {
          if (d < 1 || d > 7) throw new Error('parseHand: bad honor ' + d);
          out.push({ kind: base + d - 1, red: false });
        } else if (d === 0) {
          out.push({ kind: base + 4, red: true });
        } else {
          out.push({ kind: base + d - 1, red: false });
        }
      }
      digits = [];
    }
    if (digits.length) throw new Error('parseHand: trailing digits without suit');
    return out;
  }
  function parseHand(str) { return parseRaw(str).map(function (x) { return x.kind; }); }

  // Like parseHand but returns Tile objects with distinct ids ("0p"/"0s" => the red copy).
  function parseTiles(str, used) {
    used = used || {};
    return parseRaw(str).map(function (x) {
      var id = -1;
      if (x.red) id = x.kind * 4;
      else {
        var order = (x.kind === 13 || x.kind === 22) ? [1, 2, 3, 0] : [0, 1, 2, 3];
        for (var i = 0; i < 4; i++) {
          var cand = x.kind * 4 + order[i];
          if (!used[cand]) { id = cand; break; }
        }
        if (id < 0) throw new Error('parseTiles: more than 4 of ' + tileName(x.kind));
      }
      if (used[id]) throw new Error('parseTiles: duplicate tile id ' + id);
      used[id] = true;
      return makeTile(id);
    });

            var key = (same[a].red ? 1 : 0) + (same[b].red ? 1 : 0);

  Game.prototype._win = function (winnerIdx, isTsumo, winTile, from, flags) {

  Game.prototype._ryuukyoku = function () {

    });
    this._endHand(tenpai[this.dealer], true);
  };

  Game.prototype._kyuushu = function (p) {
    var self = this;
    this._emit({
      type: 'draw_end', reason: 'kyuushu', player: p, tenpai: [false, false, false],
      hands: this.players.map(function (x, i) { return i === p ? self._closed(x) : null; }),

  Game.prototype._handleContinue = function () {

  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Game;

/* SANMA ARCADE - ai.js
 * Simple but decent deterministic AI. Uses ONLY the view (getView(i)) and the prompt.
 * Sanma.AI.decide(view, prompt) -> choice
 */
(function () {
  'use strict';

  var Sanma = (typeof window !== 'undefined' ? (window.Sanma = window.Sanma || {}) : (global.Sanma = global.Sanma || {}));
  const Engine = Sanma.Engine || (typeof require !== 'undefined' && require('./engine.js'));

  const NORTH = 30;

  function isYaochu(k) { return k >= 27 || k % 9 === 0 || k % 9 === 8; }
  function zeros() { var a = new Array(34); for (var i = 0; i < 34; i++) a[i] = 0; return a; }

  function me(view) { return view.players[view.viewer]; }
  function closedTiles(view) {
    var p = me(view);
    return p.drawnTile && typeof p.drawnTile.kind === 'number' ? p.hand.concat([p.drawnTile]) : p.hand.slice();
  }
  function countsOf(tiles) { var c = zeros(); tiles.forEach(function (t) { c[t.kind]++; }); return c; }

  // Every tile the viewer can see: own closed tiles, all rivers (not taken), all melds, kita, dora indicators.
  function visibleCounts(view) {
    var c = countsOf(closedTiles(view));
    view.players.forEach(function (p) {
      p.discards.forEach(function (d) { if (!d.taken) c[d.tile.kind]++; });
      p.melds.forEach(function (m) { m.tiles.forEach(function (t) { c[t.kind]++; }); });
      p.kita.forEach(function (t) { c[t.kind]++; });
    });
    view.doraIndicators.forEach(function (t) { c[t.kind]++; });
    for (var i = 0; i < 34; i++) if (c[i] > 4) c[i] = 4;
    return c;
  }

  function doraKinds(view) {
    var d = {};
    view.doraIndicators.forEach(function (t) { d[Engine.doraOf(t.kind)] = true; });
    return d;
  }

  function isYakuhai(view, k) {
    return k >= 31 || k === view.roundWind || k === me(view).seatWind;
  }

  // Lower = throw earlier (used only as a tie-break after shanten / ukeire).
  function keepValue(view, k, counts, dora) {
    var v;
    if (k >= 27) v = isYakuhai(view, k) ? (counts[k] >= 2 ? 6 : 1) : 0;

  // =====================================================================
  // Event queue / scheduler — one event at a time, never overlapping
  // =====================================================================
  function safeView(i) {
    if (!S.game) return null;
    try { return S.game.getView(i == null ? 0 : i); } catch (e) { return null; }
  }
  function enqueue(ev) {
    if (!S) return;
    S.queue.push({ ev: ev, view: safeView(0) });
    // do not start pumping synchronously inside game code; defer
    if (!S.pumping) { S.pumping = true; setTimeout(pumpGen(S.gen), 0); }
  }
  function pumpGen(g) { return function () { if (S && S.gen === g) next(); }; }
  function humanPromptQueued() {
    for (var i = 0; i < S.queue.length; i++) { var e = S.queue[i].ev; if (e.type === 'prompt' && e.player === 0) return true; }
    return false;
  }
  function next() {
    while (S.queue.length) {
      var item = S.queue.shift();
      var d = 0;
      try { d = handleEvent(item) || 0; } catch (e) { if (root.console) console.error('[UI] event error', item.ev, e); }
      if (d > 0) {
        if (humanPromptQueued()) d = Math.min(d, 120);
        setTimeout(pumpGen(S.gen), d / S.speed);
        return;
      }
    }
    S.pumping = false;
  }

        var dealing = pl && !pl.drawnTile;

        if (ev.player === 0) Snd.play('soft');
        if (dealing) return 20;
        return ev.player === 0 ? 220 : 160;
      }
      case 'discard':

        return 300;
      case 'riichi':

      }
      case 'kan':

      case 'kita':

      case 'win':

  // =====================================================================
  // Game lifecycle
  // =====================================================================
  function startGame() {
    Snd.ensure();
    var G = S.deps.Game;
    if (!G) { demo('table'); toast('ゲームエンジンが見つからないため、デモ表示です'); return; }
    S.gen++;
    clearTimers();
    closeOverlay();
    S.queue = []; S.pumping = false; S.prompt = null; S.sel = null; S.riichiMode = false;
    S.finalResults = null; S.continuePending = false; S.wantNext = false; S.demo = false;
    S.thinking = [false, false, false];

    hideTitle();
    $('.fx').innerHTML = '';
    try {
      S.game = new G({ names: NAMES.slice(), rng: Math.random, startScore: 35000, rounds: 2, onEvent: enqueue });
      S.game.start();
    } catch (e) {
      if (root.console) console.error('[UI] failed to start game', e);
      toast('対局を開始できませんでした');

  }

  function fallbackChoice(pr) {
    if (!pr) return { action: 'pass' };
    if (pr.kind === 'turn') {
      var ids = pr.discardable || [];
      var id = pr.drawnTile && ids.indexOf(pr.drawnTile.id) >= 0 ? pr.drawnTile.id : ids[ids.length - 1];
      return { action: 'discard', tileId: id };

    if (pr.kind === 'continue') return { action: 'next' };
    return { action: 'pass' };
  }

  function aiPrompt(p, prompt) {
    var g = S.gen;
    var hurry = !!S.prompt || humanPromptQueued();
    var delay = hurry ? 40 : (prompt.kind === 'turn' ? rand(350, 700) : rand(250, 450));
    if (prompt.kind === 'turn') setThinking(p, true);
    setTimeout(function () {
      if (!S || S.gen !== g || !S.game) return;
      setThinking(p, false);
      if (!(function () { try { return S.game.getView(p).pending; } catch (e) { return true; } })()) return; // already answered
      var v = null, pr = prompt, choice;
      try { v = S.game.getView(p); if (v && v.pending) pr = v.pending; } catch (e) { /* ignore */ }
      try { choice = S.deps.AI ? S.deps.AI.decide(v, pr) : fallbackChoice(pr); } catch (e) { if (root.console) console.error('[UI] AI.decide failed', e); choice = fallbackChoice(pr); }
      try { S.game.respond(p, choice); } catch (e) {
        if (root.console) console.error('[UI] respond failed for AI', p, choice, e);
        try { S.game.respond(p, fallbackChoice(pr)); } catch (e2) { if (root.console) console.error('[UI] fallback respond failed', e2); }
      }
      kick();

  }

  // =====================================================================

  function humanPrompt(prompt, v) {

      // nothing on screen to acknowledge: move on shortly
      var g = S.gen;
      S.nextT = setTimeout(function () { if (S && S.gen === g && S.continuePending && !S.panel) respondNext(); }, 900);
      return;
    }
    S.prompt = prompt; S.promptView = v; S.sel = null; S.riichiMode = false; S.chooser = null;
    if (v) render(v, {});
    var st = S.settings;
    var g2 = S.gen;
    // automatic handling
    if (prompt.kind === 'call') {
      if (!prompt.canRon && !prompt.canPon && !prompt.canKan) { humanRespond({ action: 'pass' }); return; }
      if (prompt.canRon && st.autoWin) { showActions(); S.autoT = setTimeout(function () { if (S && S.gen === g2 && S.prompt === prompt) humanRespond({ action: 'ron' }); }, 450); return; }
      if (!prompt.canRon && st.noCalls) { humanRespond({ action: 'pass' }); return; }
    } else if (prompt.kind === 'turn') {
      if (prompt.canTsumo && st.autoWin) { showActions(); S.autoT = setTimeout(function () { if (S && S.gen === g2 && S.prompt === prompt) humanRespond({ action: 'tsumo' }); }, 450); return; }
      var me = v ? P(v, 0) : {};
      var only = (prompt.discardable || []).length === 1;
      if (me.riichi && only && !prompt.canTsumo && !prompt.canKita && !(prompt.kans || []).length) {
        showActions('none');
        S.autoT = setTimeout(function () { if (S && S.gen === g2 && S.prompt === prompt) humanRespond({ action: 'discard', tileId: prompt.discardable[0] }); }, 550);
        return;
      }
      // pre-select the drawn tile for quick Enter / double-tap tsumogiri
    }
    showActions();
  }

  // timerMode: undefined = (re)start countdown, 'keep' = leave it running, 'none' = no countdown

  function startPromptTimer() {
    stopTimer();
    if (!S.settings.timer || !S.prompt) return;
    var secs = S.prompt.kind === 'call' ? Math.max(3, Math.round(S.settings.seconds * 0.6)) : S.settings.seconds;
    var tm = $('.timer'), fill = $('.t-fill'), num = $('.t-num');
    tm.hidden = false; tm.classList.remove('low');
    fill.style.transition = 'none'; fill.style.transform = 'scaleX(1)';
    fill.style.setProperty('--tdur', secs + 's');
    void fill.offsetWidth;
    fill.style.transition = 'transform ' + secs + 's linear';
    fill.style.transform = 'scaleX(0)';
    var end = Date.now() + secs * 1000, lastSec = secs;
    num.textContent = secs;
    var g = S.gen, pr = S.prompt;
    S.timerTick = setInterval(function () {
      if (!S || S.gen !== g) return;
      var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      if (left !== lastSec) { lastSec = left; num.textContent = left; if (left <= 3 && left > 0) Snd.play('tick'); }
      tm.classList.toggle('low', left <= 3);
    }, 200);
    S.timer = setTimeout(function () { if (S && S.gen === g && S.prompt === pr) onTimeout(); }, secs * 1000);
  }
  function stopTimer() {
    if (!S) return;

    if (S.timerTick) { clearInterval(S.timerTick); S.timerTick = null; }
    var tm = S.stage && $('.timer'); if (tm) tm.hidden = true;
  }

  function onTimeout() {

    if (pr.kind === 'turn') {
      if (S.settings.autoWin && pr.canTsumo) return humanRespond({ action: 'tsumo' });
      humanRespond(fallbackChoice(pr));
    } else if (pr.kind === 'call') {
      if (S.settings.autoWin && pr.canRon) return humanRespond({ action: 'ron' });
      humanRespond({ action: 'pass' });
    }
  }

  function humanRespond(choice) {
    var pr = S.prompt;
    if (!pr) return;
    if (S.demo) { demoRespond(choice); return; }
    S.prompt = null; S.sel = null; S.riichiMode = false; S.chooser = null;
    if (S.autoT) { clearTimeout(S.autoT); S.autoT = null; }
    hideActions();
    try {
      S.game.respond(0, choice);
    } catch (e) {
      if (root.console) console.error('[UI] respond failed', choice, e);
      toast('その操作はできません');
      S.prompt = pr;
      if (S.promptView) render(S.promptView, {});
      showActions();
      return;
    }
    if (S.view) renderHuman(S.view, {}), renderHint(S.view);
    kick();
  }

  function respondNext() {
    S.continuePending = false;
    if (S.demo || !S.game) return;
    try { S.game.respond(0, { action: 'next' }); } catch (e) { if (root.console) console.error('[UI] continue failed', e); }
    kick();
  }

  // tile click / selection
  function onTileClick(id) {
    var pr = S.prompt;
    if (!pr || pr.kind !== 'turn') return;
    var en = enabledSet();
    if (!en || !en[id]) return;
    if (S.sel === id) {
      var ch = { action: 'discard', tileId: id };
      if (S.riichiMode) ch.riichi = true;
      humanRespond(ch);
      return;
    }
    S.sel = id;
    Snd.play('select');
    renderHuman(S.view, {});
    renderHint(S.view);
  }

  function moveSel(dir) {
    var pr = S.prompt;
    if (!pr || pr.kind !== 'turn') return;
    var ids = Array.prototype.map.call(S.stage.querySelectorAll('.hand-row .ht:not([disabled])'), function (b) { return +b.getAttribute('data-id'); });
    if (!ids.length) return;
    var i = ids.indexOf(S.sel);
    i = i < 0 ? (dir > 0 ? 0 : ids.length - 1) : (i + dir + ids.length) % ids.length;
    S.sel = ids[i];
    renderHuman(S.view, {}); renderHint(S.view);
    var b = S.stage.querySelector('.hand-row .ht[data-id="' + S.sel + '"]');
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }

  function showChooser(kind) {
    var pr = S.prompt, ch = $('.chooser'), h = '';
    var find = function (id) {
      var me = S.view ? P(S.view, 0) : {};
      var all = (me.hand || []).concat(me.drawnTile ? [me.drawnTile] : []);
      for (var i = 0; i < all.length; i++) if (all[i] && all[i].id === id) return all[i];
      return mkTile(id);
    };
    if (kind === 'pon') {
      (pr.ponTileIds || []).forEach(function (pair, i) {
        h += '<button type="button" data-act="pon-pick" data-i="' + i + '" aria-label="' + pair.map(function (id) { return tileLabel(find(id)); }).join('と') + 'でポン">' + pair.map(function (id) { return tileHTML(find(id)); }).join('') + '</button>';
      });
    } else {
      (pr.kans || []).forEach(function (k, i) {
        var t = k.tileIds && k.tileIds.length ? find(k.tileIds[0]) : kindTile(k.kind);
        h += '<button type="button" data-act="kan-pick" data-i="' + i + '" aria-label="' + tileLabel(t) + 'で' + (k.type === 'kakan' ? '加槓' : '暗槓') + '">' + tileHTML(t) + tileHTML(t) + '</button>';
      });
    }
    ch.innerHTML = h;
    ch.hidden = false;
    var f = ch.querySelector('button'); if (f) try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }

  function onAction(act, btn) {
    var pr = S.prompt;
    switch (act) {
      case 'start': startGame(); return;
      case 'settings': openSettings(!$('.drawer').classList.contains('open')); return;
      case 'close-settings': openSettings(false); return;
      case 'next': onNextClick(); return;
      case 'again': startGame(); return;
      case 'title': S.gen++; clearTimers(); S.game = null; S.prompt = null; hideActions(); showTitle(); return;
    }
    if (!pr) return;
    switch (act) {
      case 'tsumo': humanRespond({ action: 'tsumo' }); break;
      case 'ron': humanRespond({ action: 'ron' }); break;
      case 'pass': humanRespond({ action: 'pass' }); break;
      case 'kita': humanRespond({ action: 'kita' }); break;
      case 'kyuushu': humanRespond({ action: 'kyuushu' }); break;
      case 'minkan': humanRespond({ action: 'kan' }); break;
      case 'riichi':
        S.riichiMode = !S.riichiMode;
        if (S.riichiMode) {
          var rd = pr.riichiDiscards || [];
          S.sel = S.sel != null && rd.indexOf(S.sel) >= 0 ? S.sel : (pr.drawnTile && rd.indexOf(pr.drawnTile.id) >= 0 ? pr.drawnTile.id : null);
        }
        renderHuman(S.view, {}); renderHint(S.view);
        showActions('keep');
        break;
      case 'pon':
        if ((pr.ponTileIds || []).length > 1) showChooser('pon');
        else humanRespond({ action: 'pon', tileIds: (pr.ponTileIds || [])[0] });
        break;
      case 'ankan': {
        var ks = pr.kans || [];
        if (ks.length > 1) showChooser('kan');
        else if (ks.length) humanRespond({ action: 'kan', kind: ks[0].kind, type: ks[0].type });
        break;
      }
      case 'pon-pick': humanRespond({ action: 'pon', tileIds: pr.ponTileIds[+btn.getAttribute('data-i')] }); break;
      case 'kan-pick': { var k = pr.kans[+btn.getAttribute('data-i')]; humanRespond({ action: 'kan', kind: k.kind, type: k.type }); break; }
    }
  }

  function onStageClick(e) {
    var t = e.target;
    var tileBtn = t.closest && t.closest('.hand-row .ht');
    if (tileBtn) { if (!tileBtn.disabled) onTileClick(+tileBtn.getAttribute('data-id')); return; }
    var a = t.closest && t.closest('[data-act]');
    if (a && !a.disabled) { onAction(a.getAttribute('data-act'), a); return; }
    // click outside the drawer closes it
    var d = $('.drawer');
    if (d.classList.contains('open') && !(t.closest && t.closest('.drawer'))) openSettings(false);
  }

  function onKey(e) {
    if (!S) return;
    if (e.key === 'Escape' && $('.drawer').classList.contains('open')) { openSettings(false); e.preventDefault(); return; }
    var pr = S.prompt;
    var tag = e.target && e.target.tagName;
    if (!pr) {
      if (e.key === 'Enter' && S.panel && tag !== 'BUTTON') { onNextClick(); e.preventDefault(); }
      return;
    }
    if (pr.kind === 'turn') {
      if (e.key === 'ArrowLeft') { moveSel(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { moveSel(1); e.preventDefault(); }
      else if (e.key === 'Enter') {
        if (tag === 'BUTTON' && !(e.target.classList.contains('ht'))) return;
        if (S.sel != null) { onTileClick(S.sel); e.preventDefault(); }
        else if (e.target.classList && e.target.classList.contains('ht')) { onTileClick(+e.target.getAttribute('data-id')); e.preventDefault(); }
      } else if (e.key === 'Escape' && S.riichiMode) { onAction('riichi'); e.preventDefault(); }
    } else if (pr.kind === 'call') {
      if (e.key === 'Escape' || (e.key === ' ' && tag !== 'BUTTON')) { humanRespond({ action: 'pass' }); e.preventDefault(); }
    }
  }

  // =====================================================================
  // Result panels
  // =====================================================================
  function openOverlay(html) {
    var ov = $('.overlay');
    ov.innerHTML = html;
    ov.hidden = false;
    S.panel = ov.firstElementChild;
    var b = ov.querySelector('.big-btn:not([disabled])');
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  function closeOverlay() {
    if (!S) return;
    var ov = $('.overlay');
    ov.hidden = true; ov.innerHTML = '';
    S.panel = null;
    if (S.nextT) { clearTimeout(S.nextT); S.nextT = null; }
  }
  function enableNext() {
    var b = S.panel && S.panel.querySelector('[data-act="next"]');
    if (!b) return;
    b.disabled = false;
    try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    scheduleAutoNext();
  }
  function scheduleAutoNext() {
    if (!S.settings.timer || S.demo) return;
    if (S.nextT) clearTimeout(S.nextT);
    var g = S.gen;
    var note = S.panel && S.panel.querySelector('.auto');
    if (note) note.textContent = '一定時間で自動的に進みます';
    S.nextT = setTimeout(function () { if (S && S.gen === g && S.panel) onNextClick(); }, 15000);
  }

  function onNextClick() {
    if (!S.panel || !S.panel.querySelector('[data-act="next"]')) return;
    var res = S.result;
    if (res && res.type === 'win' && res.idx < res.ev.winners.length - 1) {
      res.idx++;
      openOverlay(winPanelHTML(res.ev, res.idx, res.names));
      if (S.continuePending || S.finalResults || S.demo) enableNext();
      Snd.play('fanfare');
      return;
    }
    closeOverlay();
    S.result = null;
    if (S.demo) { demo('table'); return; }
    if (S.finalResults && !S.continuePending) { showFinal(); return; }
    if (S.continuePending) { respondNext(); if (S.finalResults) showFinal(); return; }
    S.wantNext = true;
  }

    if (!isTsumo) value = (pm.ron || 0) - 300 * hb;

    else { value = tN * 2; split = fmt(tN) + ' オール'; }

      (extra.length ? '<div class="wp-split">' + extra.join('　') + '</div>' : '');

  function onWin(ev, v) {
    if (!ev.winners || !ev.winners.length) return 0;
    if (v) render(v, {});
    var names = namesOf(v || S.view);
    var w0 = ev.winners[0];
    var isTsumo = w0.from == null;
    flash(isTsumo ? 'ツモ' : 'ロン', w0.player, 'big hold', 1300);
    burst();
    Snd.play('clack'); Snd.say(isTsumo ? 'ツモ' : 'ロン');
    showDeltas(ev.scoreDeltas);
    // stats
    S.stats.hands++;
    if (ev.winners.some(function (w) { return w.player === 0; })) S.stats.wins++;
    saveJSON('sanma.stats', S.stats);
    S.result = { type: 'win', ev: ev, idx: 0, names: names };
    var g = S.gen;
    setTimeout(function () {
      if (!S || S.gen !== g || !S.result || S.result.ev !== ev) return;
      openOverlay(winPanelHTML(ev, 0, names));
      Snd.play('fanfare');
      if (S.continuePending || S.finalResults) enableNext();
    }, 1100);
    return 1200;
  }

  // =====================================================================
  // Demo (hard-coded realistic view, works without Game/AI/Engine)
  // =====================================================================
  function T(kind, copy, red) { var id = kind * 4 + (copy || 0); return { id: id, kind: kind, red: red != null ? red : isRedId(id) }; }
  function K(str) {
    // "1p2p5P" style helper (capital = red five) -> tiles with unique copies
    var out = [], used = {}, re = /(\d)([mpsMPS])|([ESWNHGR])/g, m;
    var hon = { E: 27, S: 28, W: 29, N: 30, H: 31, G: 32, R: 33 };
    while ((m = re.exec(str))) {
      var kind, red = false;
      if (m[3]) kind = hon[m[3]];
      else { kind = (+m[1] - 1) + { m: 0, p: 9, s: 18 }[m[2].toLowerCase()]; red = m[2] === 'P' || m[2] === 'S'; }
      var copy = 0;
      if (!red) { used[kind] = used[kind] == null ? ((kind === 13 || kind === 22) ? 1 : 0) : used[kind] + 1; copy = used[kind]; }
      out.push(T(kind, copy % 4, red));
    }
    return out;
  }
  function riv(str, opts) {
    opts = opts || {};
    return K(str).map(function (t, i) { return { tile: t, riichi: i === opts.riichi, taken: (opts.taken || []).indexOf(i) >= 0 }; });
  }

          kita: [T(30, 3)], furiten: false },
        { name: '雀士A', score: 41300, seatWind: 27, isDealer: true, riichi: true, hand: new Array(13).fill(null), drawnTile: null, handCount: 13,
          discards: riv('SE9s1s1m8s7pR2p3sW', { riichi: 7 }), melds: [], kita: [T(30, 0), T(30, 1)] },
        { name: '雀士B', score: 29700, seatWind: 28, isDealer: false, riichi: false, hand: new Array(10).fill(null), drawnTile: null, handCount: 10,
          discards: riv('E1pWN9s2s8s1s5s6p3m9m'.replace('3m', '9p')), melds: [{ type: 'pon', tiles: [T(31, 0), T(31, 1), T(31, 2)], calledTile: T(31, 2), from: 0 }], kita: [] }

    return v;
  }

  function demoWinEvent() {
    var hand = K('2p3p4p5P6p7p3s4s5s6s7s8s9p9p');
    return {
      type: 'win',
      winners: [{
        player: 0, from: null, hand: hand, melds: [], winTile: hand[5], uraIndicators: [T(12, 3)], kita: [T(30, 3)],
        result: {
          yaku: [{ name: '立直', han: 1 }, { name: '門前清自摸和', han: 1 }, { name: '平和', han: 1 }, { name: '一発', han: 1 },
            { name: '赤ドラ', han: 1 }, { name: '抜きドラ', han: 1 }, { name: '裏ドラ', han: 1 }],
          han: 7, fu: 20, yakuman: 0, limitName: '跳満', basePoints: 3000,
          payments: { total: 13300, ron: 0, tsumoDealer: 6150, tsumoNonDealer: 6150, honba: 1, riichiSticks: 1 }
        }
      }],
      doraIndicators: [T(20, 2)],
      scoreDeltas: [13300, -6150, -6150]
    };
  }

  function demo(mode) {
    if (!S) mount(hasDOM ? (document.getElementById('app') || document.body) : null, Sanma);
    mode = mode || 'table';
    S.gen++;
    clearTimers();
    closeOverlay();
    S.demo = true; S.game = null;
    openSettings(false);
    if (mode === 'title') { S.demo = false; showTitle(); return Sanma.UI; }
    hideTitle();
    var v = demoView();
    S.view = v;
    S.prompt = null;
    render(v, {});
    if (mode === 'table' || mode === 'settings') {
      S.prompt = v.pending; S.promptView = v;
      showActions();
      if (mode === 'settings') openSettings(true);
    } else if (mode === 'turn') {
      // own-turn variant: 14 tiles with riichi available
      var me = v.players[0];
      me.hand = K('1p1p3p4p5P6s7s8s9m9m'); me.drawnTile = T(15, 1);
      v.turn = 0; v.lastDiscard = null; v.players[2].drawnTile = null;
      var ids = me.hand.map(function (t) { return t.id; }).concat([me.drawnTile.id]);
      S.prompt = { kind: 'turn', drawnTile: me.drawnTile, canTsumo: false, canRiichi: false, riichiDiscards: [], canKita: false, kans: [], discardable: ids, canKyuushu: false };
      S.sel = me.drawnTile.id;
      render(v, {});
      showActions();
    } else if (mode === 'riichi' || mode === 'pon') {
      var m0 = v.players[0];
      v.lastDiscard = null;
      if (mode === 'riichi') {
        m0.melds = []; m0.hand = K('2p3p4p6p7p8p3s3s3s3s9s9sN'); m0.drawnTile = T(26, 2);
        v.turn = 0;
        var nId = m0.hand[12].id;
        S.prompt = { kind: 'turn', drawnTile: m0.drawnTile, canTsumo: false, canRiichi: true, riichiDiscards: [nId, m0.hand[0].id], canKita: true,
          kans: [{ type: 'ankan', kind: 20, tileIds: m0.hand.slice(6, 10).map(function (t) { return t.id; }) }, { type: 'kakan', kind: 32, tileIds: [T(32, 3).id] }],
          discardable: m0.hand.map(function (t) { return t.id; }).concat([m0.drawnTile.id]), canKyuushu: false };
      } else {
        m0.hand = K('1p1p3p4p5P5p5p6s7s8s');
        v.lastDiscard = { player: 2, tile: T(13, 3) };
        S.prompt = { kind: 'call', from: 2, tile: T(13, 3), canRon: false, canPon: true, ponTileIds: [[52, m0.hand[5].id], [m0.hand[5].id, m0.hand[6].id]], canKan: true, kanTileIds: [52, m0.hand[5].id, m0.hand[6].id], isChankan: false };
      }
      S.promptView = v;
      render(v, {});
      showActions();
    } else if (mode === 'win') {
      var ev = demoWinEvent();
      S.result = { type: 'win', ev: ev, idx: 0, names: namesOf(v) };
      openOverlay(winPanelHTML(ev, 0, namesOf(v)));
    } else if (mode === 'draw') {
      var dev = { type: 'draw_end', tenpai: [true, true, false], hands: [K('1p1p3p4p5P6s7s8s9m9m'), K('2p3p4p6p7p8p2s3s4sEEE5s'), null], scoreDeltas: [1500, 1500, -3000] };
      S.result = { type: 'draw', ev: dev };
      openOverlay(drawPanelHTML(dev, namesOf(v), v));
    } else if (mode === 'final') {
      S.finalResults = [{ player: 0, score: 52300, rank: 1, points: 42.3 }, { player: 1, score: 31700, rank: 2, points: -8.3 }, { player: 2, score: 21000, rank: 3, points: -34.0 }];
      showFinal();
    } else if (mode === 'banner') {
      banner(v);
    }
    return Sanma.UI;
  }

  function demoRespond(choice) {
    if (choice.action === 'ron') { S.prompt = null; hideActions(); flash('ロン', 0, 'big hold', 1100); burst(); Snd.play('fanfare'); setTimeout(function () { if (S && S.demo) demo('win'); }, 1100); return; }
    if (choice.action === 'discard') { toast('デモ表示です（打牌: ' + tileLabel(mkTile(choice.tileId)) + '）'); return; }
    toast('デモ表示です（' + ({ pass: 'パス', pon: 'ポン', kan: 'カン', tsumo: 'ツモ', kita: '北' }[choice.action] || choice.action) + '）');
    startPromptTimer();
  }

  // =====================================================================
  // Public API
  // =====================================================================
  Sanma.UI = {
    mount: mount,
    tileSVG: tileSVG,
    demo: demo,
    // exposed for debugging / tests
    _state: function () { return S; },
    _setSpeed: function (x) { if (S) S.speed = Math.max(0.1, +x || 1); },
    _kindNameJa: kindNameJa
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = Sanma.UI;
})();

</script>
<script>
(function () {
  var app = document.getElementById('app');
  var Sanma = window.Sanma;
  if (!Sanma || !Sanma.UI) { app.textContent = '読み込みに失敗しました。'; return; }
  var demo = null;
  try { demo = new URLSearchParams(location.search).get('demo'); } catch (e) {}
  Sanma.UI.mount(app, Sanma);
  if (demo || !Sanma.Game) Sanma.UI.demo(demo || 'table');
})();
</script>
</body>
